<svg viewBox="0 0 680 368" width="680" height="368" role="img" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Microsoft YaHei',-apple-system,'Segoe UI',sans-serif">
<title>bvh_processing 的四个接口与通用任务流水线</title>
<desc>服务包含 process、retarget、train、merge 四个异步接口，共用下载校验、后台处理、回调上传三段流水线。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="40" y="40" width="600" height="308" rx="20" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="60" y="66" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">bvh_processing · FastAPI 异步服务</text>

<g>
<rect x="60" y="84" width="270" height="62" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="76" y="106" font-size="14" font-weight="500" fill="#0C447C" dominant-baseline="central">POST /bvh/process</text>
<text x="76" y="126" font-size="12" fill="#185FA5" dominant-baseline="central">单文件：去噪 · 平滑 · 贴地 · 循环 · 朝向</text>
</g>
<g>
<rect x="350" y="84" width="270" height="62" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="366" y="106" font-size="14" font-weight="500" fill="#0C447C" dominant-baseline="central">POST /bvh/retarget</text>
<text x="366" y="126" font-size="12" fill="#185FA5" dominant-baseline="central">人体动作 → G1 / H2 / R1 NPZ + JSON</text>
</g>
<g>
<rect x="60" y="166" width="270" height="62" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="76" y="188" font-size="14" font-weight="500" fill="#0C447C" dominant-baseline="central">POST /bvh/train</text>
<text x="76" y="208" font-size="12" fill="#185FA5" dominant-baseline="central">BeyondMimic 训练 → MP4 + ONNX</text>
</g>
<g>
<rect x="350" y="166" width="270" height="62" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="366" y="188" font-size="14" font-weight="500" fill="#0C447C" dominant-baseline="central">POST /bvh/merge</text>
<text x="366" y="208" font-size="12" fill="#185FA5" dominant-baseline="central">多片段裁剪 · 变速 · MDM 补间拼接</text>
</g>

<text x="60" y="256" font-size="12" fill="#5F5E5A" dominant-baseline="central">四个接口共用的后台流水线</text>
<g>
<rect x="60" y="272" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="145" y="292" font-size="13" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">下载并校验</text>
<text x="145" y="310" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">MinIO + SHA-256</text>
</g>
<path d="M232 300 L253 300" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<g>
<rect x="255" y="272" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="292" font-size="13" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">后台执行</text>
<text x="340" y="310" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">算法 + GPU 任务</text>
</g>
<path d="M427 300 L448 300" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<g>
<rect x="450" y="272" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="535" y="292" font-size="13" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">回调回传</text>
<text x="535" y="310" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">multipart + 进度</text>
</g>
</svg>
