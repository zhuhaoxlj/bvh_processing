[project]
name = "bvh-processing"
version = "0.1.0"
description = "Download and process BVH files from MinIO"
readme = "README.md"
authors = [
    { name = "MarkGosling", email = "1710589105@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "mink>=1.3.0",
    "mujoco>=3.12.0",
    "numpy<2",
    "pydantic-settings>=2.15.0",
    "qpsolvers[daqp]>=4.13.0",
    "scipy>=1.17.1",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "--disable-plugin-autoload"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["src/bvh_processing/vendor"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.3",
]
