[project]
name = "bvh-processing"
version = "0.1.0"
description = "Download and process BVH files from MinIO"
readme = "README.md"
authors = [
    { name = "MarkGosling", email = "1710589105@qq.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "dgl==1.1.1",
    "einops==0.8.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "imageio-ffmpeg>=0.6.0",
    "jams==0.3.4",
    "librosa==0.10.2.post1",
    "madmom==0.16.1",
    "mink>=1.3.0",
    "mir-eval==0.7",
    "mujoco>=3.12.0",
    "numpy==1.23.5",
    "pydantic-settings>=2.15.0",
    "qpsolvers[daqp]>=4.13.0",
    "scikit-learn==1.3.2",
    "scipy>=1.13.1,<1.14",
    "setuptools<81",
    "torch==2.2.1",
    "torchaudio==2.2.1",
    "tqdm==4.66.5",
    "ujson==5.10.0",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.uv.extra-build-dependencies]
madmom = ["cython<3", "numpy==1.23.5"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
addopts = "--disable-plugin-autoload"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
    "src/bvh_processing/audio_segmentation/vendor",
    "src/bvh_processing/vendor",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.3",
]
